[package]
name = "karma"
version = "1.0.0"
description = "PII Detection & Redaction"
authors = ["chen"]
edition = "2024"
license = "MIT"
default-run = "karma"

[profile.dev]
incremental = true

[lib]
name = "karma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
arboard = "3"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# API server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# Utils
anyhow = "1"
log = "0.4"
chrono = "0.4"
opener = { version = "0.7", features = ["reveal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokenizers = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
mlx-rs = { version = "0.25", features = ["metal", "accelerate"] }
mlx-sys = "=0.2.0"
objc2-app-kit = "0.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
ort = "2.0.0-rc.13"
ndarray = "0.16"

[features]
default = []
onnx-cuda = ["ort/cuda"]
onnx-directml = ["ort/directml"]

[patch.crates-io]
mlx-sys = { path = "vendor/mlx-sys" }
mlx-rs = { path = "vendor/mlx-rs" }
esaxx-rs = { path = "vendor/esaxx-rs" }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
